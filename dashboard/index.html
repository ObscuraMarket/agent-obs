<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OBS desk</title>
  <meta name="theme-color" content="#050505">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* Values are the app's own (obscura.market/app exchange component). */
    :root {
      --bg: #050505;
      --card: linear-gradient(145deg, #161816 0%, #1a1c1a 100%);
      --card-raised: linear-gradient(135deg, #1e211e 0%, #262a26 100%);
      --badge: linear-gradient(135deg, #353a35 0%, #262a26 100%);
      --box: #16181699;
      --line: #2a2e2a;
      --line-strong: #373c37;
      --line-badge: #4f574f;
      --row-line: rgba(55, 60, 55, .6);
      --white: #fff;
      --muted: #8a968a;
      --muted-deep: #656f65;
      --lime: #b8ff3d;
      --lime-ink: #07130a;
      --amber: #ffce4d;
      --red: #ff6b6b;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--white); }
    body { font-family: "Plus Jakarta Sans", sans-serif; font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
    a { color: var(--lime); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .num { font-variant-numeric: tabular-nums; }

    .app { max-width: 1180px; margin: 0 auto; padding: 28px 20px 56px; }
    .bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand svg { width: 34px; height: 34px; display: block; }
    .brand b { font-size: 17px; font-weight: 800; letter-spacing: .14em; }
    .brand span { color: var(--muted); font-weight: 600; letter-spacing: .3px; margin-left: 6px; }
    .chips { display: flex; gap: 10px; flex-wrap: wrap; }
    .chip { display: inline-flex; align-items: center; gap: 9px; background: #161816; border: 1px solid var(--line); border-radius: 14px; padding: 10px 16px; font-size: 13px; font-weight: 600; letter-spacing: .3px; color: var(--white); }
    .chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted-deep); }
    .chip.on i { background: var(--lime); box-shadow: 0 0 10px rgba(184, 255, 61, .5); }
    .chip.warn i { background: var(--amber); }

    .card { background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 22px 24px 24px; }
    .card + .card { margin-top: 18px; }
    .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
    .card-head h2 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: .3px; color: var(--white); text-transform: uppercase; }
    .card-head span { color: var(--muted); font-size: 13px; font-weight: 500; }

    .boxes { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    .box { border: 1px solid var(--line); background: var(--box); border-radius: 14px; padding: 14px 16px; transition: border-color .3s ease; }
    .box:hover { border-color: var(--line-badge); }
    .box .lbl { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .box .val { font-size: 24px; font-weight: 600; color: var(--white); margin-top: 6px; white-space: nowrap; }
    .box .val.lime { color: var(--lime); text-shadow: 0 0 12px rgba(184, 255, 61, .3); }
    .box .val.red { color: var(--red); }
    .box .sub { font-size: 13px; font-weight: 500; color: var(--muted-deep); margin-top: 2px; }
    svg.spark { width: 100%; height: 40px; display: block; margin-top: 6px; }

    .cols { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(320px, .7fr); gap: 18px; margin-top: 18px; }
    @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }

    .rows { display: flex; flex-direction: column; gap: 10px; }
    .row { border: 1px solid var(--row-line); border-radius: 10px; padding: 14px 16px; background: transparent; transition: all .3s ease; }
    .row:hover { border-color: var(--line-strong); background: rgba(22, 24, 22, .5); }
    .row .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; }
    .row .name { font-size: 14px; font-weight: 700; letter-spacing: .3px; color: var(--white); }
    .row .amt { font-size: 16px; font-weight: 700; color: var(--lime); text-shadow: 0 0 12px rgba(184, 255, 61, .3); white-space: nowrap; }
    .row .amt.plain { color: var(--white); text-shadow: none; }
    .row p { margin: 0 0 4px; font-size: 14px; color: var(--white); }
    .row .why { font-size: 13px; color: var(--muted); }
    .row .when { font-size: 12px; color: var(--muted-deep); font-weight: 500; }
    .badge { background: var(--badge); border: 1.5px solid var(--line-badge); border-radius: 6px; padding: 5px 10px; display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; color: var(--white); min-width: 74px; justify-content: center; letter-spacing: .3px; text-transform: uppercase; }
    .badge.lime { background: var(--lime); border-color: var(--lime); color: var(--lime-ink); box-shadow: 0 2px 8px rgba(184, 255, 61, .4); }
    .badge.amber { color: var(--amber); border-color: rgba(255, 206, 77, .5); }
    .badge.red { color: var(--red); border-color: rgba(255, 107, 107, .5); }
    details { margin-top: 6px; }
    summary { font-size: 12px; color: var(--muted-deep); cursor: pointer; font-weight: 600; letter-spacing: .3px; }
    details ul { margin: 6px 0 0; padding-left: 16px; font-size: 12.5px; color: var(--muted); }

    .kv { list-style: none; margin: 0; padding: 0; }
    .kv li { display: flex; justify-content: space-between; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); font-size: 14px; }
    .kv li:first-child { border-top: 0; padding-top: 2px; }
    .kv li .k { color: var(--muted); font-weight: 500; }
    .kv li .v { font-weight: 700; color: var(--white); }
    .kv li .v.lime { color: var(--lime); }
    .none { color: var(--muted-deep); font-size: 14px; font-weight: 500; padding: 4px 0; }

    .feed .row p { font-size: 14px; }
    .foot { margin-top: 20px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--muted-deep); font-weight: 500; }
    .foot .err { color: var(--red); }
  </style>
</head>
<body>
  <div class="app">
    <div class="bar">
      <div class="brand">
        <!-- Swap this mark for the app's own logo asset when embedding. -->
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <g fill="#b8ff3d">
            <circle cx="32" cy="32" r="10"/>
            <path d="M32 2c5 7 5 15 0 22-5-7-5-15 0-22zm0 60c-5-7-5-15 0-22 5 7 5 15 0 22zM2 32c7-5 15-5 22 0-7 5-15 5-22 0zm60 0c-7 5-15 5-22 0 7-5 15-5 22 0z"/>
            <path d="M11 11c8 1 14 7 15 15-8-1-14-7-15-15zm42 0c-1 8-7 14-15 15 1-8 7-14 15-15zM11 53c1-8 7-14 15-15-1 8-7 14-15 15zm42 0c-8-1-14-7-15-15 8 1 14 7 15 15z" opacity=".85"/>
          </g>
        </svg>
        <div><b>OBSCURA</b><span id="subtitle">OBS desk</span></div>
      </div>
      <div class="chips">
        <div class="chip" id="st-exec"><i></i><span>Execution off</span></div>
        <div class="chip" id="st-voice"><i></i><span>Voice</span></div>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h2>Desk</h2><span id="cycle-s"></span></div>
      <div class="boxes">
        <div class="box"><div class="lbl">PnL</div><div class="val num" id="pnl">$0.00</div><div class="sub num" id="pnl-s">no capital</div></div>
        <div class="box"><div class="lbl">Equity</div><div class="val num" id="equity">$0.00</div><svg class="spark" id="spark" viewBox="0 0 300 40" preserveAspectRatio="none"></svg></div>
        <div class="box"><div class="lbl">Capital</div><div class="val num" id="capital">$0.00</div><div class="sub" id="capital-s">nothing deposited</div></div>
        <div class="box"><div class="lbl">Trades</div><div class="val num" id="trades-n">0</div><div class="sub" id="trades-s">settled</div></div>
      </div>
    </div>

    <div class="cols">
      <div>
        <div class="card">
          <div class="card-head"><h2>Thoughts</h2><span id="thoughts-n"></span></div>
          <div class="rows" id="thoughts"><div class="none">Nothing yet.</div></div>
        </div>
        <div class="card feed">
          <div class="card-head"><h2>Feed</h2><span id="feed-h"></span></div>
          <div class="rows" id="feed"><div class="none">Nothing yet.</div></div>
        </div>
      </div>
      <div>
        <div class="card">
          <div class="card-head"><h2>Book</h2><span id="book-s"></span></div>
          <ul class="kv" id="book"><li class="none">No capital on the book.</li></ul>
        </div>
        <div class="card">
          <div class="card-head"><h2>Trades</h2></div>
          <div class="rows" id="trades"><div class="none">No trades.</div></div>
        </div>
        <div class="card">
          <div class="card-head"><h2>Market</h2><span id="reads-at"></span></div>
          <ul class="kv" id="market"></ul>
        </div>
      </div>
    </div>

    <div class="foot">
      <div><a href="https://obscura.market" target="_blank" rel="noopener">obscura.market</a> &middot; <a id="handle" href="https://x.com/ObscuraCEX" target="_blank" rel="noopener">@ObscuraCEX</a></div>
      <div class="err" id="err"></div>
    </div>
  </div>

  <script>
    var params = new URLSearchParams(location.search);
    var API = (params.get("api") || window.OBS_API || "").replace(/\/+$/, "");

    function el(id) { return document.getElementById(id); }
    function esc(s) { return String(s == null ? "" : s).replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }); }
    function pad(n) { return (n < 10 ? "0" : "") + n; }
    function when(ts) {
      var d = new Date(ts), now = new Date();
      var t = pad(d.getHours()) + ":" + pad(d.getMinutes());
      return d.toDateString() === now.toDateString() ? t : pad(d.getMonth() + 1) + "/" + pad(d.getDate()) + " " + t;
    }
    function ago(ts) {
      if (!ts) return "";
      var m = Math.round((Date.now() - ts) / 60000);
      if (m < 1) return "just now";
      if (m < 60) return m + " min ago";
      var h = Math.round(m / 60);
      if (h < 48) return h + " h ago";
      return Math.round(h / 24) + " d ago";
    }
    function usd(v, signed) {
      if (v == null || isNaN(v)) return "n/a";
      return (signed && v > 0 ? "+" : "") + (v < 0 ? "-" : "") + "$" + Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    function qty(v) { return v == null ? "" : Number(v).toLocaleString("en-US", { maximumFractionDigits: 6 }); }
    function get(path) {
      return fetch(API + path, { headers: { Accept: "application/json" } }).then(function (r) {
        if (!r.ok) throw new Error(path.split("?")[0] + " " + r.status);
        return r.json();
      });
    }
    function chip(id, cls, text) { var c = el(id); c.className = "chip " + cls; c.lastElementChild.textContent = text; }

    function status(s) {
      chip("st-exec", s.desk.canExecute ? "on" : "", s.desk.canExecute ? "Execution on" : "Execution off");
      chip("st-voice", s.agent.mode === "live" ? "on" : s.agent.mode === "draft" ? "warn" : "", s.agent.mode === "live" ? "Voice live" : s.agent.mode === "draft" ? "Voice draft" : "Voice off");
      el("subtitle").textContent = s.desk.canExecute ? "OBS desk" : "OBS desk, observation";
      el("handle").textContent = "@" + s.agent.handle;
      el("handle").href = "https://x.com/" + s.agent.handle;
      el("feed-h").textContent = "@" + s.agent.handle;
      el("cycle-s").textContent = s.desk.lastThoughtAt ? "last cycle " + ago(s.desk.lastThoughtAt) : "no cycle yet";
    }
    function pnl(p) {
      var s = p.snapshot;
      var v = el("pnl");
      v.textContent = usd(s.pnlUsd, true);
      v.className = "val num " + (s.pnlUsd > 0 ? "lime" : s.pnlUsd < 0 ? "red" : "");
      el("pnl-s").textContent = s.pnlPct != null ? (s.pnlPct >= 0 ? "+" : "") + (s.pnlPct * 100).toFixed(2) + "%" : "no capital";
      el("equity").textContent = usd(s.equityUsd);
      el("capital").textContent = usd(s.netCapitalUsd);
      el("capital-s").textContent = p.capital.deposits ? p.capital.deposits + " deposit" + (p.capital.deposits > 1 ? "s" : "") + (p.capital.withdrawals ? ", " + p.capital.withdrawals + " out" : "") : "nothing deposited";
      el("trades-n").textContent = p.trades.settled;
      el("trades-s").textContent = "settled" + (p.trades.pending ? ", " + p.trades.pending + " pending" : "") + (p.trades.proposed ? ", " + p.trades.proposed + " proposed" : "");
      spark(p.series || []);

      var held = Object.keys(s.holdings || {});
      var rows = held.map(function (a) {
        var px = p.prices && p.prices[a];
        var val = px != null ? usd(s.holdings[a] * px) : (a === "USDG" || a === "USDC" || a === "USDT" ? usd(s.holdings[a]) : "unpriced");
        return "<li><span class='k'>" + esc(a) + "</span><span class='v num'>" + qty(s.holdings[a]) + " <span style='color:var(--muted);font-weight:500'>" + val + "</span></span></li>";
      });
      if (s.inFlightUsd) rows.push("<li><span class='k'>In flight</span><span class='v num'>" + usd(s.inFlightUsd) + "</span></li>");
      el("book").innerHTML = rows.length ? rows.join("") : "<li class='none'>No capital on the book.</li>";
      el("book-s").textContent = s.unpriced && s.unpriced.length ? "unpriced: " + s.unpriced.join(", ") : "";
    }
    function spark(series) {
      var svg = el("spark");
      var pts = series.filter(function (x) { return x.equityUsd != null; });
      if (pts.length < 2) { svg.innerHTML = ""; return; }
      var min = Math.min.apply(null, pts.map(function (x) { return x.equityUsd; }));
      var max = Math.max.apply(null, pts.map(function (x) { return x.equityUsd; }));
      var span = max - min || 1, t0 = pts[0].at, dt = (pts[pts.length - 1].at - t0) || 1;
      var d = pts.map(function (x, i) { return (i ? "L" : "M") + (((x.at - t0) / dt) * 300).toFixed(1) + " " + (36 - ((x.equityUsd - min) / span) * 32).toFixed(1); }).join(" ");
      svg.innerHTML = '<path d="' + d + '" fill="none" stroke="' + (pts[pts.length - 1].equityUsd >= pts[0].equityUsd ? "#b8ff3d" : "#ff6b6b") + '" stroke-width="2" stroke-linejoin="round"/>';
    }
    function thoughts(t) {
      el("thoughts-n").textContent = t.items.length ? t.items.length + " cycles" : "";
      if (!t.items.length) { el("thoughts").innerHTML = "<div class='none'>Nothing yet.</div>"; return; }
      el("thoughts").innerHTML = t.items.map(function (it) {
        var d = it.decision || { kind: "hold" };
        var badge = d.kind === "propose-swap" ? "<span class='badge amber'>Proposes</span>" : "<span class='badge'>Hold</span>";
        var swap = d.kind === "propose-swap" ? "<span class='amt plain num'>" + esc(d.amount) + " " + esc(d.from) + " &rarr; " + esc(d.to) + "</span>" : "";
        var body = (it.thoughts || []).map(function (l) { return "<p>" + esc(l) + "</p>"; }).join("");
        var why = d.reason ? "<div class='why'>" + esc(d.reason) + "</div>" : "";
        var inputs = (it.observation || []).length ? "<details><summary>Inputs</summary><ul>" + it.observation.map(function (o) { return "<li>" + esc(o) + "</li>"; }).join("") + "</ul></details>" : "";
        return "<div class='row'><div class='top'><span>" + badge + " " + swap + "</span><span class='when'>" + when(it.at) + "</span></div>" + body + why + inputs + "</div>";
      }).join("");
    }
    function trades(t) {
      if (!t.items.length) { el("trades").innerHTML = "<div class='none'>No trades.</div>"; return; }
      el("trades").innerHTML = t.items.map(function (x) {
        var cls = x.status === "settled" ? "lime" : x.status === "pending" || x.status === "proposed" ? "amber" : "red";
        var tx = x.explorerUrl ? " <a href='" + esc(x.explorerUrl) + "' target='_blank' rel='noopener'>tx</a>" : "";
        return "<div class='row'><div class='top'><span class='name'>" + qty(x.from.amount) + " " + esc(x.from.asset) + " &rarr; " + esc(x.to.asset) + "</span><span class='badge " + cls + "'>" + esc(x.status) + "</span></div><div class='top' style='margin:0'><span class='when'>" + when(x.at) + (x.partner ? " &middot; " + esc(x.partner) : "") + tx + "</span><span class='amt" + (x.to.amount ? "" : " plain") + " num'>" + (x.to.amount ? qty(x.to.amount) + " " + esc(x.to.asset) : (x.from.usd != null ? usd(x.from.usd) : "")) + "</span></div></div>";
      }).join("");
    }
    function feed(f) {
      if (!f.items.length) { el("feed").innerHTML = "<div class='none'>Nothing yet.</div>"; return; }
      el("feed").innerHTML = f.items.slice(0, 8).map(function (it) {
        var badge = it.posted ? "<span class='badge lime'>Posted</span>" : "<span class='badge'>" + esc(it.mode) + "</span>";
        var link = it.url ? " &middot; <a href='" + esc(it.url) + "' target='_blank' rel='noopener'>x.com</a>" : "";
        return "<div class='row'><div class='top'><span>" + badge + (it.kind === "reply" ? " <span class='when'>reply</span>" : "") + "</span><span class='when'>" + when(it.at) + link + "</span></div><p>" + esc(it.text) + "</p></div>";
      }).join("");
    }
    function market(r) {
      var rows = [];
      if (r.prices && r.prices.btcUsd != null) rows.push(["BTC", usd(r.prices.btcUsd), ""]);
      if (r.prices && r.prices.ethUsd != null) rows.push(["ETH", usd(r.prices.ethUsd), ""]);
      if (r.token && r.token.symbol) rows.push([r.token.symbol + " holders", r.token.holders != null ? r.token.holders.toLocaleString("en-US") : "n/a", ""]);
      if (r.token && r.token.totalSupply) rows.push([r.token.symbol + " supply", r.token.totalSupply, ""]);
      rows.push(["App", r.siteUp ? "Up" : "Down", r.siteUp ? "lime" : ""]);
      rows.push(["Routing API", r.apiUp ? "Healthy" : "Down", r.apiUp ? "lime" : ""]);
      el("market").innerHTML = rows.map(function (kv) { return "<li><span class='k'>" + esc(kv[0]) + "</span><span class='v num " + kv[2] + "'>" + esc(kv[1]) + "</span></li>"; }).join("");
      el("reads-at").textContent = ago(r.at);
    }
    function refresh() {
      el("err").textContent = "";
      var fail = function (e) { el("err").textContent = e.message; };
      get("/api/obs/status").then(status).catch(fail);
      get("/api/obs/pnl?hours=168").then(pnl).catch(fail);
      get("/api/obs/thoughts?limit=12").then(thoughts).catch(fail);
      get("/api/obs/trades?limit=20").then(trades).catch(fail);
      get("/api/obs/feed?limit=8").then(feed).catch(fail);
      get("/api/obs/reads").then(market).catch(fail);
    }
    refresh();
    setInterval(refresh, 60000);
  </script>
</body>
</html>
