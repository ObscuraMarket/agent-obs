<!-- The OBS console at /console: one surface for talking to your agent and for shaping it, next to the desk's
     read-only commands and your own wallet's swaps. A line is a message to your agent; a slash line is a command.
     The desk routes every command; the page streams the chat, signs nothing, and holds no key. -->
<div class="obs-console">
  <div class="cli" (click)="focusInput()">
    <div class="cli__bar">
      <span class="cli__dot" [class.on]="agentState === 'ready' || agentState === 'thinking'" [class.warn]="agentState === 'locked'" aria-hidden="true"></span>
      <span class="cli__who">{{ agentName }}</span>
      <span class="cli__addr">{{ wallet ? short(wallet) : 'not signed in' }}</span>
      <span class="cli__pill" [class.on]="elig?.eligible" title="Verified swaps from your wallet against the bar that unlocks your own agent">{{ elig ? elig.swaps : 0 }} of {{ elig?.required || 3 }} swaps<ng-container *ngIf="elig?.eligible"> · eligible</ng-container></span>
      <button type="button" class="cli__signin" (click)="onSignInClick($event)" [disabled]="status === 'signing'">{{ status === 'signed-in' ? 'signed in' : status === 'signing' ? 'signing…' : 'sign in with wallet' }}</button>
      <a class="cli__link" href="/agent">the desk</a>
    </div>

    <div class="cli__scroll" #screen aria-live="polite">
      <ng-container *ngFor="let g of groups; let i = index; let last = last">
        <p class="cli__cmd" *ngIf="g.kind === 'command'"><span class="cli__cmd-mark" aria-hidden="true">›</span>{{ g.lines[0].text }}</p>
        <div class="cli__row cli__row--me" *ngIf="g.kind === 'input'"><div class="cli__bubble cli__bubble--me">{{ g.lines[0].text }}</div></div>
        <div class="cli__row" *ngIf="g.kind === 'agent'">
          <div class="cli__bubble cli__bubble--agent">{{ g.lines[0].text }}<span class="cli__caret" *ngIf="g.lines[0].streaming && last" aria-hidden="true"></span></div>
        </div>
        <div *ngIf="g.kind === 'system'">
          <p class="cli__note">{{ joined(g) }}</p>
          <div class="cli__suggest" *ngIf="suggestOf(g).length">
            <button type="button" *ngFor="let one of suggestOf(g)" class="cli__chip" [class.cli__chip--cmd]="one.startsWith('/')" (click)="runLine(one)" [disabled]="busy || agentState === 'thinking'">{{ one }}</button>
          </div>
        </div>
        <div *ngIf="g.kind === 'output' || g.kind === 'error'">
          <pre class="cli__out" [class.cli__out--error]="g.kind === 'error'">{{ joinedLines(g) }}</pre>
          <div class="cli__suggest" *ngIf="suggestOf(g).length">
            <button type="button" *ngFor="let one of suggestOf(g)" class="cli__chip" [class.cli__chip--cmd]="one.startsWith('/')" (click)="runLine(one)" [disabled]="busy || agentState === 'thinking'">{{ one }}</button>
          </div>
        </div>
      </ng-container>
      <pre class="cli__out cli__out--error" *ngIf="agentError">{{ agentError }}</pre>
    </div>

    <div class="cli__hint" *ngIf="hint.length">
      <button type="button" *ngFor="let h of hint" class="cli__hint-item" (click)="pickHint(h)">{{ h }}</button>
    </div>

    <form class="cli__input-row" (submit)="submit($event)">
      <span class="cli__prompt" aria-hidden="true">&gt;</span>
      <input #cmd class="cli__input" type="text" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" [placeholder]="placeholder" (keydown)="onKey($event)" (input)="hint = []" [disabled]="agentState === 'provisioning'" aria-label="OBS console input">
    </form>
  </div>
</div>
